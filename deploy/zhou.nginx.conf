server {
    listen 80;
    listen [::]:80;
    server_name zhou.opendeep.top;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zhou.opendeep.top;
    server_tokens off;
    client_max_body_size 100m;
    sendfile on;
    tcp_nopush on;

    ssl_certificate /etc/nginx/ssl/zhou.opendeep.top.crt;
    ssl_certificate_key /etc/nginx/ssl/zhou.opendeep.top.key;

    add_header X-Content-Type-Options "nosniff" always;

    location = /updates/version.json {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /downloads/DeltaStatsAssistant.zip {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /downloads/DeltaStatsAssistant-Setup.exe {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /updates/ {
        alias /var/lib/delta-stats/releases/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /downloads/ {
        alias /var/lib/delta-stats/releases/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
