name: Windows Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify POSIX publishing contracts
        run: |
          bash -n deploy/publish_release.sh
          bash -n deploy/publish_download_site.sh
          python -m unittest -v test_release_delivery

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Unit tests
        run: python -m unittest -v
      - name: Synthetic UI tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $server = Start-Process python -ArgumentList @('tools/preview_ui.py', '--port', '4178') -WindowStyle Hidden -PassThru -RedirectStandardOutput artifacts/preview.stdout.log -RedirectStandardError artifacts/preview.stderr.log
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $identity = Invoke-RestMethod http://127.0.0.1:4178/api/preview -TimeoutSec 2
                if ($identity.synthetic_data_only) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw 'Synthetic preview failed to start' }
            npm run test:ui
            if ($LASTEXITCODE -ne 0) { throw 'UI tests failed' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-ui-evidence
          path: artifacts/
          retention-days: 7
